apiVersion: apps/v1
kind: Deployment
metadata:
  name: wild-tour
  namespace: default
  labels:
    app: wild-tour
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: wild-tour
    template:
      metadata:
        labels:
          app: wild-tour
      spec:
        containers:
          - name: wild-tour
            image: 229032673310.dkr.ecr.ap-south-1.amazonaws.com/wild-tour:jenkins-56
            ports:
              - name: http
                containerPort: 8080
            imagePullPolicy: Always
            env:
              - name: DB_URL
                valueFrom:
                  configMapKeyRef:
                    name: wild-tour-config
                    key: DB_URL
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: wild-tour-db-secret
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: wild-tour-db-secret
                    key: DB_PASSWORD
