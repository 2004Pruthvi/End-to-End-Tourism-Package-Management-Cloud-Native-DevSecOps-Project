apiVersion: apps/v1
kind: Deployment
metadata:
  name: wild-tour
  namespace: wild-tour
  labels:
    app: wild-tour
spec:
    replicas: 2
    selector:
      matchLabels:
        app: wild-tour
    template:
      metadata:
        labels:
          app: wild-tour
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
        containers:
          - name: wild-tour
            securityContext:
              allowPrivilegeEscalation: false
            image: 229032673310.dkr.ecr.ap-south-1.amazonaws.com/wild-tour:nonroot-1
            ports:
              - name: http
                containerPort: 8080
            readinessProbe:
              httpGet:
                path: /Wild_Tour/Home.jsp
                port: http
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
            imagePullPolicy: Always
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            env:
              - name: DB_URL
                valueFrom:
                  configMapKeyRef:
                    name: wild-tour-config
                    key: DB_URL
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: wild-tour-db-secret
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: wild-tour-db-secret
                    key: DB_PASSWORD
